<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#14122b" />
  <title>Join Midnight Egg</title>
  <style>
    :root { --bg: #14122b; --panel: #1f1c3d; --text: #ecebff; --muted: #a29fd0; --accent: #ffcf5a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }
    body { display: grid; place-items: center; padding: 16px; }
    main { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5vw; align-items: center; max-width: 1400px; }
    @media (max-aspect-ratio: 1/1) { main { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; } }
    #qr { background: #fff; padding: 2vmin; border-radius: 2vmin; line-height: 0; }
    #qr svg { width: min(70vmin, 640px); height: auto; display: block; }
    h1 { font-size: clamp(32px, 6vmin, 80px); margin: 0 0 2vmin; }
    .lead { font-size: clamp(18px, 3vmin, 36px); color: var(--muted); margin: 0 0 4vmin; }
    #url { font-size: clamp(18px, 3.4vmin, 40px); font-weight: 700; color: var(--accent); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    #status { margin-top: 4vmin; font-size: clamp(16px, 2.6vmin, 30px); color: var(--muted); }
    #status b { color: var(--text); }
    #error { color: #ff9a9a; }
  </style>
  <script src="/vendor/qrcode-generator-1.4.4.js"></script>
</head>
<body>
  <main>
    <div id="qr" aria-label="QR code to join"></div>
    <div>
      <h1>🥚 Midnight Egg</h1>
      <p class="lead">Scan to join, then cast spells at the wizard.<br />Same Wi-Fi as this room.</p>
      <div id="url"></div>
      <div id="status"></div>
      <div id="error"></div>
    </div>
  </main>

  <script>
    const PHASES = { lobby: 'Waiting for the round to start', dusk: 'Dusk', storm: 'Storm', midnight: 'Midnight!', over: 'Round over' };

    async function showQr() {
      try {
        const { audience_url: url } = await (await fetch('/api/join-info')).json();
        const qr = qrcode(0, 'M');
        qr.addData(url);
        qr.make();
        document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
        document.getElementById('url').textContent = url.replace(/^https?:\/\//, '');
        if (/^http:\/\/(localhost|127\.)/.test(url)) {
          document.getElementById('error').textContent = 'This address only works on this computer. Restart serve.py with --join-host <this computer’s Wi-Fi address>.';
        }
      } catch (err) {
        document.getElementById('error').textContent = `Can’t reach the game server: ${err.message}`;
      }
    }

    function listen() {
      const events = new EventSource('/api/events?role=spectator');
      events.addEventListener('game:state', (e) => {
        const s = JSON.parse(e.data);
        const status = document.getElementById('status');
        status.replaceChildren(document.createElement('b'), ` joined · ${PHASES[s.phase] ?? s.phase}`);
        status.firstChild.textContent = `${s.audience}`;
      });
      events.onerror = () => { if (events.readyState === EventSource.CLOSED) setTimeout(() => { showQr(); listen(); }, 3000); };
    }

    showQr();
    listen();
  </script>
</body>
</html>
