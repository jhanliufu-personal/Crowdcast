<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#14122b" />
  <title>Midnight Egg Host</title>
  <style>
    :root {
      --bg: #14122b; --panel: #1f1c3d; --panel-2: #2a2650; --line: #3b3670;
      --text: #ecebff; --muted: #a29fd0; --accent: #ffcf5a; --danger: #ff7a7a; --ok: #6be3a0;
      --preset: #6be3a0; --remix: #ffcf5a; --novel: #c99bff;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, sans-serif; }
    body { padding: 16px; max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 10px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
    h2 .count { color: var(--text); font-size: 15px; letter-spacing: 0; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); padding: 8px 14px; border-radius: var(--radius); }
    button.primary { background: var(--accent); color: #241a00; border-color: var(--accent); font-weight: 700; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .card { background: var(--panel); border-radius: var(--radius); padding: 14px; }

    #key-form { max-width: 420px; margin: 15vh auto; display: grid; gap: 10px; }
    #key-form input { padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel); }

    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-bottom: 14px; }
    #conn { font-size: 13px; }
    #conn::before { content: "●"; margin-right: 4px; color: var(--danger); }
    #conn.live::before { color: var(--ok); }
    #phase { font-weight: 700; }
    #clock { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
    #egg { display: flex; gap: 3px; align-items: center; font-size: 13px; }
    #egg i { width: 10px; height: 14px; border-radius: 50% 50% 45% 45%; background: #e8e2c8; display: inline-block; }
    #egg i.cracked { background: var(--danger); }
    #scores { display: flex; gap: 6px; flex-wrap: wrap; }
    #scores span { font-size: 13px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); border-left: 4px solid; }
    #controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    #controls-msg { color: var(--danger); font-size: 13px; }
    #forge { font-size: 13px; }

    .grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }
    @media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
    .stack { display: grid; gap: 14px; }

    .rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .rows li.empty { color: var(--muted); font-size: 14px; }
    .req { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; background: var(--panel-2); border-radius: 10px; padding: 8px 10px; border-left: 4px solid var(--line); }
    .req .pos { grid-row: 1 / span 2; font-weight: 800; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
    .req .who { font-weight: 600; font-size: 14px; }
    .req .who .team { font-weight: 400; color: var(--muted); }
    .req .what { grid-column: 2; font-size: 14px; overflow-wrap: anywhere; }
    .req .side { grid-row: 1 / span 2; grid-column: 3; text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
    .tier { font-size: 12px; font-weight: 700; }
    .stage { font-size: 12px; color: var(--accent); }
    .tier.preset { color: var(--preset); } .tier.remix { color: var(--remix); } .tier.novel { color: var(--novel); }
    .chip { display: inline-block; padding: 0 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.08); }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); }
    td { padding: 6px; border-bottom: 1px solid var(--panel-2); vertical-align: top; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #55507f; margin-right: 6px; }
    .dot.on { background: var(--ok); }
    .teamtag { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 12px; color: #fff; }
    .status { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <form id="key-form" class="hidden">
    <h1>Host</h1>
    <p class="muted">Enter the host key printed by <code>serve.py</code> (or set with WORLDTINDER_HOST_KEY).</p>
    <input id="key-input" placeholder="Host key" autocomplete="off" required />
    <button class="primary">Open host view</button>
    <p id="key-error" class="muted"></p>
  </form>

  <main id="main" class="hidden">
    <header>
      <h1>🥚 Host</h1>
      <span id="conn">connecting</span>
      <span id="phase"></span>
      <span id="clock"></span>
      <span id="egg"></span>
      <span id="scores"></span>
      <span id="controls">
        <span id="controls-msg"></span>
        <button id="start" class="primary" type="button">Start round</button>
        <button id="reset" type="button">Reset</button>
      </span>
    </header>

    <div class="grid">
      <div class="stack">
        <section class="card">
          <h2>Queue <span class="count" id="queue-count"></span> <span id="forge"></span></h2>
          <ol class="rows" id="queue"></ol>
        </section>
        <section class="card">
          <h2>Ready <span class="count" id="ready-count"></span></h2>
          <ul class="rows" id="ready"></ul>
        </section>
        <section class="card">
          <h2>In the sky <span class="count" id="in_flight-count"></span></h2>
          <ul class="rows" id="in_flight"></ul>
        </section>
      </div>

      <section class="card">
        <h2>Audience <span class="count" id="roster-count"></span></h2>
        <table>
          <thead><tr><th>Name</th><th>Team</th><th class="num">Casts</th><th class="num">Hits</th><th>Latest spell</th></tr></thead>
          <tbody id="roster"></tbody>
        </table>
      </section>
    </div>
  </main>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const TIERS = { preset: '⚡ Preset', remix: '✨ Remix', novel: '🔮 Novel' };
    const PHASES = { lobby: 'Lobby', dusk: 'Dusk', storm: 'Storm', midnight: 'Midnight', over: 'Round over' };
    const EMPTY = {
      queue: 'Nothing waiting.',
      ready: 'Nothing ready.', in_flight: 'No spells in the air.',
    };

    let key = new URLSearchParams(location.hash.slice(1)).get('key');
    let catalog = null;
    let view = null;
    let state = null;
    let events = null;

    function el(tag, { dataset, ...props } = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props);
      Object.assign(node.dataset, dataset); // dataset is read-only as a whole; its entries aren't
      for (const c of children) if (c != null) node.append(c);
      return node;
    }

    async function api(path, method = 'GET') {
      const res = await fetch(path, { method, headers: { 'X-Host-Key': key || '' } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { status: res.status });
      return data;
    }

    function label(p) {
      if (p.type === 'text') return `“${p.text}”`;
      const table = catalog[p.kind === 'spell' ? 'spells' : p.kind + 's'];
      const b = table.find((x) => x.id === p.id);
      if (!b) return p.id;
      const emoji = p.kind === 'spell' ? catalog.assets.find((a) => a.id === b.asset)?.emoji : b.emoji;
      return `${emoji ?? ''} ${b.name ?? b.label}`;
    }

    function describe(parts) {
      const span = el('span');
      parts.forEach((p, i) => {
        if (i) span.append(' ');
        span.append(p.type === 'text' ? label(p) : el('span', { className: 'chip', textContent: label(p) }));
      });
      return span;
    }

    function ago(epochSeconds) {
      const s = Math.max(0, Math.round(Date.now() / 1000 - epochSeconds));
      return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
    }

    // ---- key ---------------------------------------------------------------------------------

    $('#key-form').addEventListener('submit', (e) => {
      e.preventDefault();
      key = $('#key-input').value.trim();
      history.replaceState(null, '', `#key=${encodeURIComponent(key)}`);
      start();
    });

    async function start() {
      try {
        catalog = catalog || await api('/api/catalog');
        view = await api('/api/admin/view'); // checks the key before opening the stream
      } catch (err) {
        $('#key-form').classList.remove('hidden');
        $('#main').classList.add('hidden');
        $('#key-error').textContent = err.status === 403 ? 'That key isn’t right.' : err.message;
        return;
      }
      $('#key-form').classList.add('hidden');
      $('#main').classList.remove('hidden');
      renderView();
      connect();
    }

    // ---- live updates ------------------------------------------------------------------------

    function connect() {
      events?.close();
      events = new EventSource(`/api/events?role=host&key=${encodeURIComponent(key)}`);
      events.onopen = () => { $('#conn').className = 'live'; $('#conn').textContent = 'live'; };
      events.addEventListener('host:view', (e) => { view = JSON.parse(e.data); renderView(); });
      events.addEventListener('game:state', (e) => { state = JSON.parse(e.data); renderState(); });
      events.onerror = () => {
        $('#conn').className = '';
        $('#conn').textContent = 'reconnecting';
        if (events.readyState === EventSource.CLOSED) setTimeout(start, 3000); // e.g. the server restarted
      };
    }

    function renderState() {
      $('#phase').textContent = PHASES[state.phase] ?? state.phase;
      const s = Math.max(0, Math.ceil(state.remaining_s));
      $('#clock').textContent = state.phase === 'lobby' || state.phase === 'over' ? (state.outcome ? `egg ${state.outcome}` : '') : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} to midnight`;
      $('#egg').replaceChildren(
        ...Array.from({ length: state.max_cracks }, (_, i) => el('i', { className: i < state.cracks ? 'cracked' : '' })),
        el('span', { className: 'muted', textContent: ` charge ${state.charge}` }),
      );
      $('#scores').replaceChildren(...state.teams.map((t) => {
        const span = el('span', { textContent: `${t.name} ${state.scores[t.id]}` });
        span.style.borderLeftColor = t.color;
        return span;
      }));
      $('#forge').textContent = state.forge_online ? '' : '· LLM forge offline: remix and novel requests wait here';
      $('#forge').className = 'muted';
      const running = !['lobby', 'over'].includes(state.phase);
      $('#start').disabled = running;
      $('#start').textContent = state.phase === 'over' ? 'New round' : 'Start round';
    }

    // Where a request is within its list: claimed by a forge (still queued until it acks), or sent but not yet confirmed by the headset.
    function stage(r) {
      if (r.lease) return el('div', { className: 'stage', textContent: `forging · try ${r.lease.attempt} · ${Math.round(r.lease.seconds_left)}s left` });
      if (r.status === 'sent') return el('div', { className: 'stage', textContent: 'sent, awaiting headset' });
      if (r.status === 'cast') return el('div', { className: 'stage', textContent: 'in the scene' });
      return null;
    }

    function requestRow(r, list) {
      const li = el('li', { className: 'req' },
        el('span', { className: 'pos', textContent: list === 'queue' ? `#${r.ahead + 1}` : '' }),
        el('span', { className: 'who' }, r.caster.name, el('span', { className: 'team', textContent: ` · ${r.caster.team}` })),
        el('span', { className: 'side' },
          el('div', { className: `tier ${r.tier}`, textContent: TIERS[r.tier] }),
          el('div', { className: 'age', textContent: ago(r.created_at), dataset: { created: r.created_at } }),
          stage(r),
        ),
        el('span', { className: 'what' }, r.spell ? `${r.spell.name} · “${r.spell.incantation}” ` : '', r.spell ? null : describe(r.parts)),
      );
      li.style.borderLeftColor = r.caster.color;
      return li;
    }

    function renderView() {
      if (!view) return;
      for (const list of ['queue', 'ready', 'in_flight']) {
        const rows = view[list];
        $(`#${list}-count`).textContent = rows.length;
        $(`#${list}`).replaceChildren(...(rows.length ? rows.map((r) => requestRow(r, list)) : [el('li', { className: 'empty', textContent: EMPTY[list] })]));
      }
      $('#roster-count').textContent = `${view.roster.length} joined · ${view.roster.filter((m) => m.online).length} online`;
      $('#roster').replaceChildren(...(view.roster.length ? view.roster.map((m) => {
        const tag = el('span', { className: 'teamtag', textContent: m.team });
        tag.style.background = m.color;
        const latest = m.latest
          ? el('span', {}, describe(m.latest.parts), el('div', { className: 'status', textContent: `${TIERS[m.latest.tier]} · ${m.latest.status}` }))
          : el('span', { className: 'muted', textContent: '—' });
        return el('tr', {},
          el('td', { title: m.online ? 'connected' : 'not connected' }, el('span', { className: `dot${m.online ? ' on' : ''}` }), m.name),
          el('td', {}, tag),
          el('td', { className: 'num', textContent: m.casts }),
          el('td', { className: 'num', textContent: m.hits }),
          el('td', {}, latest),
        );
      }) : [el('tr', {}, el('td', { colSpan: 5, className: 'muted', textContent: 'Nobody has joined yet.' }))]));
    }

    // Waiting times tick locally; nothing is fetched for this.
    setInterval(() => {
      for (const node of document.querySelectorAll('.age')) node.textContent = ago(Number(node.dataset.created));
    }, 1000);

    // ---- controls ----------------------------------------------------------------------------

    async function control(path) {
      $('#controls-msg').textContent = '';
      try {
        await api(path, 'POST');
      } catch (err) {
        $('#controls-msg').textContent = err.message;
      }
    }
    $('#start').addEventListener('click', () => control('/api/admin/start'));
    $('#reset').addEventListener('click', () => {
      if (confirm('Reset to the lobby? Every pending spell expires.')) control('/api/admin/reset');
    });

    if (key) start();
    else $('#key-form').classList.remove('hidden');
  </script>
</body>
</html>
